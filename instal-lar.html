<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Afegir multa">
  <meta name="robots" content="noindex, nofollow">
  <link rel="apple-touch-icon" href="https://xgerardlopez.github.io/multesSeniorB/img/logo.png">
  <link rel="icon" href="https://xgerardlopez.github.io/multesSeniorB/img/logo.png">
  <title>Instal·lar · Afegir multa</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #081a3a;
      --navy-light: #163a72;
      --yellow: #f5c400;
      --muted: rgba(255,255,255,.72);
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      place-items: center;
      background: linear-gradient(145deg, var(--navy-light), var(--navy) 68%);
      color: #fff;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(420px, 100%);
      text-align: center;
    }

    .logo {
      width: 112px;
      height: 112px;
      margin-bottom: 28px;
      border-radius: 25px;
      box-shadow: 0 18px 48px rgba(0,0,0,.28);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--yellow);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 10vw, 46px);
      letter-spacing: -.045em;
      line-height: 1;
    }

    p {
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .install-note {
      margin-top: 32px;
      padding: 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 14px;
    }

    .open-button {
      display: flex;
      width: 100%;
      min-height: 56px;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      border-radius: 15px;
      background: var(--yellow);
      color: var(--navy);
      font-weight: 850;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="img/logo.png" alt="AE Minguella">
    <p class="eyebrow">AE Minguella · Senior B</p>
    <h1>Afegir multa</h1>
    <p>Instal·la aquest accés a la pantalla d’inici per entrar ràpidament al formulari.</p>
    <p class="install-note">A Safari, prem <strong>Compartir</strong> i després <strong>Afegir a la pantalla d’inici</strong>.</p>
    <a class="open-button" href="https://script.google.com/macros/s/AKfycbwl3T4MXCbpq4uXV6OJagKyg6tg1gXBP15OrgJJZ6l8MGcVbWVzGE2kbSlQF8_Sdh_d/exec">Obrir l’aplicació</a>
  </main>

  <script>
    if (window.navigator.standalone === true) {
      window.location.replace("https://script.google.com/macros/s/AKfycbwl3T4MXCbpq4uXV6OJagKyg6tg1gXBP15OrgJJZ6l8MGcVbWVzGE2kbSlQF8_Sdh_d/exec");
    }
  </script>
</body>
</html>
